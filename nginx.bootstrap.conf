# Temporary HTTP-only config used solely to obtain the initial Let's Encrypt certificate.
server {
    listen 80;
    server_name decemberdelights.in www.decemberdelights.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
