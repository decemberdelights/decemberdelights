# December Delights — Nginx Config (10/10 staged, no look change)
# Place this in: /etc/nginx/sites-available/decemberdelights
# Then: sudo ln -s /etc/nginx/sites-available/decemberdelights /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# Obtain the Let's Encrypt certificate with nginx.bootstrap.conf first, then
# install this file. Port 80 serves only ACME challenges and redirects traffic.
#
# Hybrid storage notes (Hostinger 50GB + Supabase free):
# - Public images: /uploads/public/* -> /var/www/decemberdelights/uploads/public (immutable 1yr)
# - Private docs: NEVER exposed here. Only via FastAPI GET /api/files/* (admin JWT + CSRF).
# - Requires: sudo mkdir -p /var/www/decemberdelights/uploads/public /var/www/decemberdelights/uploads/private
#             sudo chown -R www-data:www-data /var/www/decemberdelights/uploads
#             sudo chmod 755 /var/www/decemberdelights/uploads/public
#             sudo chmod 750 /var/www/decemberdelights/uploads/private

# --- top-level (put in /etc/nginx/nginx.conf http{} once) ---
# Optional perf/rate-limit zones — enable together with the proxy_cache/limit_req
# directives commented inside this file's server{} block. Safe to leave off.
# proxy_cache_path /var/cache/nginx/dd levels=1:2 keys_zone=dd_cache:10m max_size=1g inactive=60m use_temp_path=off;
# limit_req_zone $binary_remote_addr zone=dd_api:10m rate=10r/s;
# (If you cannot edit nginx.conf, the server{} below still works — caching falls back to headers only.)

server {
    listen 80;
    server_name decemberdelights.in www.decemberdelights.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name decemberdelights.in www.decemberdelights.in;

    ssl_certificate /etc/letsencrypt/live/decemberdelights.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/decemberdelights.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security: block dotfiles, hide version
    server_tokens off;
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Gzip API/JSON (no visual change, smaller TTFB on 1vCPU)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # --- Public uploads (Hostinger local disk, immutable) ---
    # Same URL as backend local_storage.py: /uploads/public/products|menu/*
    location /uploads/public/ {
        alias /var/www/decemberdelights/uploads/public/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        # Safety net: never serve anything with /private/ in the path from
        # this public alias. (Left nested on purpose — hoisting it to a
        # server-level regex location would also intercept /uploads/private/*
        # requests that are currently proxied to Next.js, changing behavior.)
        location ~ /private/ {
            deny all;
        }
    }

    # --- Backend API (FastAPI) — must be BEFORE / so /api/* is not sent to Next.js ---
    location /api/ {
        # Burst 20 allows checkout spikes on 1vCPU without 503; sustained 10r/s per IP
        # Uncomment after adding limit_req_zone in nginx.conf:
        # limit_req zone=dd_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- Frontend (Next.js) ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # --- Static files cache ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        # Effective only if proxy_cache_path + proxy_cache dd_cache is set in http{}.
        # Kept harmless if not: headers below still give browser 1yr cache.
        # proxy_cache dd_cache;
        # proxy_cache_valid 200 365d;
        # proxy_cache_use_stale error timeout updating;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- Video files cache ---
    location ~* \.(mp4|webm|mov)$ {
        proxy_pass http://127.0.0.1:3000;
        # proxy_cache dd_cache;
        # proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # NOTE: Do NOT block /admin here — the Next.js admin panel lives at /admin
    # and auth is handled by the FastAPI backend (JWT + rate limit).
    # If you want IP-restriction, use: allow YOUR_IP; deny all; inside location /admin/
}
