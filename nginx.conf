# December Delights — Nginx Config
# Place this in: /etc/nginx/sites-available/decemberdelights
# Then: sudo ln -s /etc/nginx/sites-available/decemberdelights /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name decemberdelights.in www.decemberdelights.in;

    # Redirect HTTP to HTTPS (uncomment after SSL is set up)
    # return 301 https://$host$request_uri;

    # --- Frontend (Next.js) ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # --- Backend API (FastAPI) — proxied through Next.js rewrites ---
    # This handles /api/* calls from the frontend
    location /api/ {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    # --- Static files cache ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 31536000s;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Video files cache ---
    location ~* \.(mp4|webm|mov)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 31536000s;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Block admin and API from external access ---
    location /admin {
        return 403;
    }
}

